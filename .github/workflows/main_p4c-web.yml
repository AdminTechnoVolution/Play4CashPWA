name: Build and deploy Node.js app to Azure Web App - p4c-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita carreras si llegan varios pushes seguidos (no cancelamos un deploy en curso).
concurrency:
  group: deploy-p4c-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      # Push del bump de versión tras deploy OK (solo main).
      contents: write
      # OIDC para azure/login.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Semver que verá el usuario/API (`X-App-Version`). Debe ejecutarse antes del build:
      # vite lee `package.json` en `vite.config.ts`.
      - name: Bump patch version for this deploy
        run: npm version patch --no-git-tag-version

      - name: Build
        env:
          VITE_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ''
        run: npm run build:azure

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F805207A69B47C2906A353DF7C17274 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9273823BF375474D87D8CFF91A3A3D5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C706E508ADC74BADBEF6BA760467828B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'p4c-web'
          slot-name: 'Production'
          package: ./azure-deploy

      # Persiste el semver en el repo. [skip ci] evita disparar este workflow otra vez.
      # Si `main` tiene branch protection, añade excepción para github-actions[bot].
      - name: Commit and push version bump
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(release): bump PWA version [skip ci]"
          git push
